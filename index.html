        header { 
            padding: 16px; text-align: center; border-bottom: 1px solid #1f2937; 
            background-color: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px);
        }
        header h1 { color: #c084fc; font-size: 20px; font-weight: bold; }
        header p { color: #9ca3af; font-size: 11px; margin-top: 4px; }
        main { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { 
            background-color: rgba(17, 24, 39, 0.96); border: 1px solid #374151; 
            padding: 20px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6); 
            max-width: 480px; width: 100%; text-align: center;
        }
        .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { 
            padding: 3px 10px; background-color: #2e1065; color: #d8b4fe; 
            border: 1px solid #581c87; font-size: 11px; font-weight: 600; border-radius: 9999px; 
        }
        .counter { color: #6b7280; font-size: 11px; font-family: monospace; }
        .text-container { min-height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        #caption-text { font-size: 15px; color: #f3f4f6; line-height: 1.5; font-weight: 500; text-align: left; }
        .btn-main { 
            width: 100%; background: linear-gradient(to right, #9333ea, #4f46e5); color: white; 
            font-weight: bold; padding: 11px; border-radius: 12px; border: none; cursor: pointer; font-size: 13px; margin-bottom: 10px;
        }
        .btn-main:active { transform: scale(0.98); }
        .grid-btns { display: grid; grid-template-cols: 1fr 1fr; gap: 10px; }
        .btn-sub { 
            background-color: #111827; color: #e5e7eb; border: 1px solid #374151; 
            padding: 9px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .btn-twitter { background-color: #2563eb; color: white; border: none; }
        #toast { 
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); 
            background-color: #9333ea; color: white; padding: 6px 14px; border-radius: 10px; 
            font-size: 11px; font-weight: bold; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; 
        }
