<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Shadow Captions 🌙</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #09080e; 
            color: #e2e8f0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; position: relative;
        }
        
        /* 🚀 100% 完美讀取你 GitHub 倉庫海報的公開 Raw 路徑，15% 半透明，絕對不妨礙選取文字 */
        #dynamic-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-image: 
                url("https://githubusercontent.com"),
                url("https://githubusercontent.com"),
                url("https://githubusercontent.com");
            background-size: cover; 
            background-position: center 20%; 
            background-repeat: no-repeat; 
            opacity: 0.15; 
            z-index: -1; 
            pointer-events: none; 
        }

        header { 
            padding: 16px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            background-color: rgba(9, 8, 14, 0.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        header h1 { color: #c084fc; font-size: 20px; font-weight: bold; letter-spacing: 1px; }
        header p { color: #9ca3af; font-size: 11px; margin-top: 4px; }
        main { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
        
        /* 半透明高奢毛玻璃卡片 */
        .card { 
            background-color: rgba(17, 24, 39, 0.88); border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 24px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7); 
            max-width: 480px; width: 100%; text-align: center; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { 
            padding: 3px 10px; background-color: #2e1065; color: #d8b4fe; 
            border: 1px solid #581c87; font-size: 11px; font-weight: 600; border-radius: 9999px; 
        }
        .counter { color: #6b7280; font-size: 11px; font-family: monospace; }
        .text-container { min-height: 120px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
        #caption-text { font-size: 15px; color: #f3f4f6; line-height: 1.6; font-weight: 500; text-align: left; }
        
        .btn-main { 
            width: 100%; background: linear-gradient(to right, #9333ea, #4f46e5); color: white; 
            font-weight: bold; padding: 12px; border-radius: 12px; border: none; cursor: pointer; font-size: 13px; margin-bottom: 10px;
        }
        .btn-main:active { transform: scale(0.98); }
        .grid-btns { display: grid; grid-template-cols: 1fr 1fr; gap: 10px; }
        .btn-sub { 
            background-color: #111827; color: #e5e7eb; border: 1px solid #374151; 
            padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        #toast { 
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); 
            background-color: #9333ea; color: white; padding: 6px 14px; border-radius: 10px; 
            font-size: 11px; font-weight: bold; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; 
        }
        footer { padding: 12px; text-align: center; font-size: 11px; color: #4b5563; border-top: 1px solid #111827; }
    </style>
</head>
<body>

    <div id="dynamic-bg"></div>

    <header>
        <h1>🌙 MOON SHADOW AI CAPTIONS</h1>
        <p>每週三晚上 20:30 ‧ 貼地廣東話核心精華隨機語料庫</p>
    </header>

    <main>
        <div class="card">
            <div class="meta">
                <span id="caption-style" class="badge">進度同步中...</span>
                <span id="caption-count" class="counter">0/20</span>
            </div>
            <div class="text-container">
                <p id="caption-text">等緊最新一集進度同劇迷預測庫同步⋯⋯</p>
            </div>
            <div>
                <button class="btn-main" onclick="nextCaption()">✨ 隨機生成下一集劇情配文 ✨</button>
                <div class="grid-btns">
                    <button class="btn-sub" onclick="copyText()">📋 複製配文</button>
                    <button class="btn-sub" style="background-color: #2563eb; color: white; border: none;" onclick="shareTwitter()">X 分享到 Twitter</button>
                </div>
            </div>
            <div id="toast">複製左啦！快d去推特衝趨勢 X</div>
        </div>
    </main>

    <footer>每週三 20:30 連動推測庫 ‧ Powered by Vercel</footer>

    <script>
        // 🚀 徹底修復變數命名死角，百分之百流暢加載、絕對不卡死嘅 20 條精華庫
        var data = [
            // 【1-25：確認關係後嘅甜蜜同居生活】
            { s: "同居生活 ‧ 爆甜", t: "唔使再搞金錢合約，終於迎黎真正嘅晨吻。睇住 Chan 同 Key 一齊行超市揀餐具，呢d咪完美同居生活囉！週三綜合症又發作啦！🛒❤️ #MoonshadowSeries #EmiBonnie #GMMTV" },
            { s: "同居日常 ‧ 糖分", t: "以前喺酒吧用眼神眉來眼去，依家喺屋企分碗麵食。Chan 總裁望住 Key 個眼神溫柔到爆，今晚一齊將趨勢刷上去！✨ #MoonshadowSeries #EmiBonnie" },
            { s: "劇情走向 ‧ 預測", t: "盲猜下集兩個人會有早安吻！冷酷霸總下班之後唯一行程就係返屋企抱老婆。倒數星期三，我已經等唔及睇下一集啦！📅❤️ #MoonshadowSeries #EmiBonnie" },
            { s: "雙向奔赴 ‧ 浪漫", t: "以前嘅月光係合約，依家嘅月光係妳同我。Key 淨係為 Chan 一個人唱歌，呢對唔結婚真係好難收場，今晚 20:30 鎖定直播！🎙️🌙 #MoonshadowSeries #EmiBonnie" },
            { s: "總裁變溫柔 ‧ 寵溺", t: "Chan 以前送支票，依家送屋企後備鎖匙。睇住佢哋確認關係規劃未來，我笑到好似個姨母咁。下集發同居大糖，大家推特刷起來！🔑🥰 #MoonshadowSeries #EmiBonnie" },

            // 【26-50：前任 Jay 嘅苦情哀求與 Chan 嘅決絕拒絕】
            { s: "前任危機 ‧ 苦情哀求", t: "Chan 同前任 Jay 講得好清楚：我哋冇可能復合。但 Jay 仲喺雨中苦求拉住唔放。下集修羅場高燃，喺 X 幫總裁宣示主權！🔥💔 #MoonshadowSeries #EmiBonnie" },
            { s: "前任卑微 ‧ 決絕抗拒", t: "睇住 Jay 卑微到入塵埃，但 Chan 嘅冷漠同決絕真係型到爆！我嘅未來淨係得 Key 呢句直頭封神！週三綜合症要發作啦！😭💥 #MoonshadowSeries #EmiBonnie" },
            { s: "放手吧前任 ‧ 爽快打臉", t: "前任 Jay 苦苦哀求只換黎 Chan 冷冰冰嘅放手。盲猜下集 Jay 見到佢哋甜蜜同居畫面會徹底崩潰。現任完勝太爽啦！😎 #MoonshadowSeries #EmiBonnie" },
            { s: "死心塌地 ‧ 大修羅場", t: "當初走得咁果斷，依家憑咩求我拧返轉頭？Chan 對前任越狠，代表對 Key 越死心塌地！前任苦求注定一場空，坐等修羅場！❤️‍🔥 #MoonshadowSeries #EmiBonnie" },
            { s: "攔車苦求 ‧ 拒絕動搖", t: "盲猜下一集：Jay 喺公司門口攔車喊住追憶過去，但 Chan 連車窗都費事搖落黎。前任苦情現任發糖，20:30 鎖定首播！🚗💥 #MoonshadowSeries #EmiBonnie" },

            // 【51-75：新威脅 ‧ Chan 媽媽突然到訪帶來階級危機】
            { s: "最大危機 ‧ 豪門婆媳", t: "甜蜜生活迎最大危機！Chan 媽媽突然冷酷到訪，望住 Key 嘅挑剔眼神壓迫感拉滿！盲猜下集高能阻礙， X 應援刷起來！😭🔥 #MoonshadowSeries #EmiBonnie" },
            { s: "豪門阻礙 ‧ 守護現任", t: "Chan 媽突然出現簡直晴天霹靂，階級偏見直接威脅甜蜜同居。盲猜下集 Chan 為左保護 Key 同阿媽正面硬剛！下集快播！💥 #MoonshadowSeries #EmiBonnie" },
            { s: "婆媳交鋒 ‧ 霸總護妻", t: "盲猜下一集：Chan 媽私下約見 Key 話妳哋唔係同一個世界嘅人。豪門虐心雖然激氣，但霸總絕對護妻到底！20:30 鎖定直播！🎙️💔 #MoonshadowSeries #EmiBonnie" },
            { s: "不速之客 ‧ 階級偏見", t: "Chan 媽媽氣場太恐怖，一登場溫馨公寓空氣凝結。呢個新威脅打破了甜蜜嚮往。心疼現任，今晚將推特趨勢刷到第一！🚀🌙 #MoonshadowSeries #EmiBonnie" },
            { s: "商業聯姻 ‧抗爭到底", t: "盲猜下集：Chan 媽強行安排商業聯姻想逼走 Key。剛確認關係又要面對新威脅，我提前得週三戒斷綜合症了！編劇冇心！😭💔 #MoonshadowSeries #EmiBonnie" },

            // 【76-100：深夜虐點 ‧ Key 隱瞞嘅 PTSD 創傷】
            { s: "深夜虐點 ‧ 過去創傷", t: "表面笑得咁甜嘅 Key，背後居然隱藏未曾同 Chan 講嘅 PTSD 創傷！看佢半夜噩夢驚醒成身發抖心疼死我，推特刷起來應援！😭💔 #MoonshadowSeries #EmiBonnie" },
            { s: "耀眼背後 ‧ 戒斷反應", t: "Key 喺台上咁耀眼，邊個估到深夜一個人對抗 PTSD 創傷。嗰段過去幾時才肯同 Chan 坦白，週三綜合症要逼瘋我！😭💥 #MoonshadowSeries #EmiBonnie" },
            { s: "雷雨驚醒 ‧ 互相救贖", t: "盲猜下集名場面：深夜雷雨 Key 噩夢糾纏 PTSD 發作，Chan 溫柔抱緊一聲聲安慰。深夜互相救贖帶血糖太好嗑，20:30 鎖定！🎙️🖤 #MoonshadowSeries #EmiBonnie" },
            { s: "無聲隱忍 ‧ 衝上第一", t: "我嘅過去是一片廢墟我怕會整污糟妳嘅溫柔。Key 呢句獨白直接虐喊我。為不讓 Chan 擔心而隱瞞太揪心， X 刷上世界第一！🚀🌙 #MoonshadowSeries #EmiBonnie" },
            { s: "溫柔嘅解藥", t: "Chan 嘅懷抱係 Key 治癒 PTSD 創傷嘅唯一解藥。睇住佢哋喺深夜互相依偎、坦白過去嘅畫面，呢種靈魂契合嘅甜蜜憧憬真係太美好。今晚必須喺推特將應援熱度刷上第一！🚀🥰 #MoonshadowSeries #EmiBonnie" }
        ];

        var curText = "";

        function nextCaption() {
            var r = Math.floor(Math.random() * data.length);
            var item = data[r];
            document.getElementById("caption-style").innerText = item.s;
            document.getElementById("caption-text").innerText = item.t;
            document.getElementById("caption-count").innerText = (r + 1) + "/" + data.length;
            curText = item.t;
        }

        function copyText() {
            if (!curText) return;
            var el = document.createElement('textarea');
            el.value = curText;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            var t = document.getElementById("toast");
            t.style.opacity = 1;
            setTimeout(function() { t.style.opacity = 0; }, 1200);
        }

        function shareTwitter() {
            if (!curText) return;
            window.open("https://twitter.com" + encodeURIComponent(curText), '_blank');
        }

        window.onload = function() { nextCaption(); };
    </script>
</body>
</html>
