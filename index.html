    <script>

            const bgLayer = document.getElementById('dynamic-bg');
            const baseName = 'Moonshadow_Poster';
            const extensions = ['', '.png', '.PNG', '.jpg', '.jpeg', '.JPG'];
            let currentTry = 0;

            function testNext() {
                if (currentTry >= extensions.length) return;
                const imgUrl = baseName + extensions[currentTry];
                const img = new Image();
                img.src = imgUrl;
                img.onload = function() { bgLayer.style.backgroundImage = `url('${imgUrl}')`; };
                img.onerror = function() { currentTry++; testNext(); };
            }

        }
